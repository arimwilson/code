<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wirdle - Wordle Coach</title>
    <link rel="icon" type="image/svg+xml" href="/wirdle-icon.svg" />
    <style>
      :root {
        --bg: #f7f7f3;
        --panel: #ffffff;
        --ink: #1f1f1f;
        --muted: #686763;
        --line: #d4d4cf;
        --tile-empty: #b8b8b4;
        --absent: #787c7e;
        --present: #c9b458;
        --correct: #6aaa64;
        --accent: #246a73;
        --accent-soft: #e3f0f2;
        --danger: #b23b32;
        --shadow: 0 18px 45px rgba(31, 31, 31, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      main {
        width: min(100% - 24px, 1040px);
        margin: 0 auto;
        padding: 14px 0 28px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 0 12px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.08em;
      }

      .brand-icon {
        display: block;
        width: 1em;
        height: 1em;
        flex: 0 0 auto;
      }

      .header-tools {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        min-width: 0;
      }

      .help-button,
      .header-info-button,
      .overlay-close,
      .info-button {
        display: inline-grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel);
        color: var(--ink);
        padding: 0;
        font-weight: 800;
      }

      .help-button,
      .header-info-button {
        width: 30px;
        height: 30px;
        flex: 0 0 auto;
      }

      .overlay {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: grid;
        place-items: center;
        padding: 18px;
      }

      .overlay[hidden] {
        display: none;
      }

      .overlay-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(31, 31, 31, 0.42);
      }

      .overlay-panel {
        position: relative;
        width: min(100%, 440px);
        max-height: min(80vh, 640px);
        display: grid;
        gap: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 16px;
        box-shadow: var(--shadow);
        overflow: auto;
      }

      .overlay-header {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 12px;
      }

      .overlay-header h2 {
        padding-top: 3px;
      }

      .overlay-close {
        width: 28px;
        height: 28px;
        flex: 0 0 auto;
      }

      .overlay-body {
        display: grid;
        gap: 10px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }

      .overlay-body p {
        margin: 0;
      }

      .overlay-action {
        min-height: 38px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        padding: 8px 12px;
        font-size: 14px;
        font-weight: 800;
      }

      .app {
        display: grid;
        gap: 18px;
        padding-top: 18px;
      }

      .play-area {
        display: grid;
        justify-items: center;
        gap: 14px;
      }

      .board-wrap {
        position: relative;
        width: min(100%, 360px);
      }

      .board {
        display: grid;
        gap: 6px;
        outline: 0;
      }

      .row {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }

      .tile {
        aspect-ratio: 1;
        width: 100%;
        border: 2px solid var(--tile-empty);
        background: var(--panel);
        color: var(--ink);
        border-radius: 0;
        display: grid;
        place-items: center;
        padding: 0;
        font-size: clamp(28px, 13vw, 48px);
        font-weight: 800;
        line-height: 1;
        text-transform: uppercase;
        user-select: none;
      }

      .tile.filled {
        border-color: #878a8c;
      }

      .tile.future {
        border-color: var(--line);
      }

      .tile.absent,
      .tile.present,
      .tile.correct {
        color: #fff;
        border-color: transparent;
      }

      .tile.absent {
        background: var(--absent);
      }

      .tile.present {
        background: var(--present);
      }

      .tile.correct {
        background: var(--correct);
      }

      button.tile:focus-visible,
      .board:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }

      .keyboard-capture {
        position: absolute;
        inset: 0 auto auto 0;
        width: 1px;
        height: 1px;
        opacity: 0.01;
        border: 0;
        padding: 0;
        pointer-events: none;
      }

      .actions {
        width: min(100%, 360px);
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }

      .action-button {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
        color: var(--ink);
        padding: 8px 12px;
        font-size: 14px;
        font-weight: 700;
      }

      .action-button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .action-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .message {
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      .message:empty {
        display: none;
      }

      .message.error {
        color: var(--danger);
        font-weight: 700;
      }

      .recommendations {
        display: grid;
        gap: 10px;
      }

      .mode-stack {
        display: grid;
        gap: 14px;
      }

      .mode-panel[hidden] {
        display: none;
      }

      .mode-panel {
        display: grid;
        gap: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 14px;
      }

      .mode-panel.primary-panel {
        border-color: color-mix(in srgb, var(--accent) 38%, var(--line));
      }

      .panel-copy {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.4;
      }

      .coach-report {
        display: grid;
        gap: 12px;
      }

      .hint-shell {
        display: grid;
        gap: 10px;
      }

      .hint-shell[hidden],
      .easy-share[hidden] {
        display: none;
      }

      .hint-card {
        display: grid;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfaf7;
        padding: 12px;
      }

      .hint-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .hint-label {
        font-size: 13px;
        font-weight: 800;
        color: var(--accent);
      }

      .hint-risk {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .hint-message,
      .hint-rationale {
        margin: 0;
        color: var(--ink);
        font-size: 14px;
        line-height: 1.4;
      }

      .hint-rationale {
        color: var(--muted);
      }

      .revealed-words {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .revealed-word {
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--accent-soft);
        color: var(--accent);
        padding: 5px 8px;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .hint-actions,
      .easy-share {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 14px;
      }

      .toggle-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--ink);
        font-weight: 700;
      }

      .toggle-label input {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
      }

      .summary-band {
        display: grid;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fbfaf7;
        padding: 12px;
      }

      .summary-line {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.4;
      }

      .turn-timeline {
        display: grid;
        gap: 8px;
      }

      .turn-review {
        display: grid;
        gap: 7px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 12px;
      }

      .turn-review-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }

      .turn-title {
        font-size: 15px;
        font-weight: 800;
      }

      .turn-grade {
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--accent);
        padding: 3px 8px;
        font-size: 13px;
        font-weight: 800;
      }

      .turn-copy {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
      }

      .advanced-shell[hidden],
      .coach-report[hidden] {
        display: none;
      }

      .advanced-shell {
        display: grid;
        gap: 8px;
      }

      .section-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      h2 {
        margin: 0;
        font-size: 18px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      .ranking-note {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #ecebe6;
        padding: 4px;
      }

      .tab-option {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 2px;
        border-radius: 6px;
      }

      .mode-tabs .tab-option {
        grid-template-columns: minmax(0, 1fr);
      }

      .tabs.mode-tabs {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .tab-option:has(.tab-button[aria-selected="true"]) {
        background: var(--panel);
        box-shadow: 0 1px 4px rgba(31, 31, 31, 0.08);
      }

      .tab-button {
        min-height: 38px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font-size: 14px;
        font-weight: 800;
      }

      .tab-button[aria-selected="true"] {
        color: var(--ink);
      }

      .tab-info-button {
        margin-right: 6px;
      }

      .recommendation-list {
        display: grid;
        gap: 8px;
      }

      .recommendation {
        position: relative;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px 12px;
        align-items: center;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 12px;
        overflow: hidden;
      }

      .recommendation.selectable {
        cursor: pointer;
      }

      .recommendation.selectable:focus-visible,
      .tab-button:focus-visible,
      .action-button:focus-visible,
      .help-button:focus-visible,
      .header-info-button:focus-visible,
      .overlay-close:focus-visible,
      .overlay-action:focus-visible,
      .info-button:focus-visible,
      .show-all-button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      .recommendation.disabled {
        cursor: not-allowed;
        opacity: 0.58;
      }

      .recommendation.best {
        border-color: var(--accent);
        background: linear-gradient(0deg, var(--accent-soft), var(--panel) 66%);
        box-shadow: var(--shadow);
      }

      .recommendation-word {
        font-size: 22px;
        line-height: 1;
        font-weight: 800;
        text-transform: uppercase;
      }

      .recommendation-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }

      .info-button {
        width: 26px;
        height: 26px;
        font-size: 13px;
        position: relative;
        z-index: 1;
      }

      .recommendation-reason {
        grid-column: 1 / -1;
        color: var(--muted);
        font-size: 13px;
      }

      .answer-note {
        grid-column: 1 / -1;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.35;
      }

      .answer-note {
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 12px;
        background: #fbfaf7;
      }

      .show-all-button {
        min-height: 38px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        padding: 8px 12px;
        font-size: 14px;
        font-weight: 800;
      }

      .recommendation-list.is-loading .recommendation {
        border-color: var(--line);
        background: #f3f2ee;
        box-shadow: none;
        color: #8b8780;
        pointer-events: none;
      }

      .recommendation-list.is-loading .recommendation.best {
        border-color: var(--line);
        background: #f3f2ee;
      }

      .recommendation-list.is-loading .recommendation-reason {
        color: #9a958d;
      }

      .recommendation-list.is-loading .recommendation::after {
        content: "";
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.58),
          transparent
        );
        animation: recommendation-refresh 1.25s ease-in-out infinite;
      }

      .loading-bar {
        display: block;
        border-radius: 999px;
        background: #dedbd4;
      }

      .loading-word {
        width: 92px;
        height: 22px;
      }

      .loading-label {
        justify-self: end;
        width: 72px;
        height: 20px;
      }

      .loading-reason {
        grid-column: 1 / -1;
        width: min(100%, 360px);
        height: 13px;
      }

      @keyframes recommendation-refresh {
        100% {
          transform: translateX(100%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .recommendation-list.is-loading .recommendation::after {
          animation: none;
        }
      }

      .empty-state {
        border: 1px dashed var(--line);
        border-radius: 8px;
        color: var(--muted);
        padding: 16px;
        text-align: center;
        font-size: 14px;
      }

      @media (min-width: 840px) {
        main {
          padding-top: 24px;
        }

        h1 {
          font-size: 30px;
        }

        .app {
          grid-template-columns: minmax(340px, 420px) minmax(0, 1fr);
          align-items: start;
          gap: 36px;
        }

        .play-area {
          position: sticky;
          top: 24px;
        }

        .board-wrap,
        .actions {
          width: 380px;
        }

        .tile {
          font-size: 48px;
        }

        .mode-stack {
          padding-top: 4px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 class="brand" aria-label="Wirdle"><img class="brand-icon" src="/wirdle-icon.svg" alt="W" />irdle</h1>
        <div class="header-tools">
          <button
            class="header-info-button"
            id="dataInfo"
            type="button"
            aria-label="Word list info"
            title="Word list info"
          >
            i
          </button>
          <button
            class="help-button"
            id="coachHelp"
            type="button"
            aria-label="How to use Wirdle"
            title="How to use Wirdle"
          >
            ?
          </button>
        </div>
      </header>

      <div class="overlay" id="infoOverlay" hidden>
        <div class="overlay-backdrop" data-close-overlay></div>
        <section
          class="overlay-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="overlayTitle"
        >
          <div class="overlay-header">
            <h2 id="overlayTitle"></h2>
            <button
              class="overlay-close"
              id="overlayClose"
              type="button"
              aria-label="Close"
            >
              x
            </button>
          </div>
          <div class="overlay-body" id="overlayBody"></div>
          <button class="overlay-action" id="overlayAction" type="button">
            Got it
          </button>
        </section>
      </div>

      <div class="app">
        <section class="play-area" aria-label="Wordle board">
          <div class="board-wrap">
            <div
              class="board"
              id="board"
              tabindex="0"
              aria-label="Guess board"
            ></div>
            <input
              class="keyboard-capture"
              id="keyboardCapture"
              type="text"
              inputmode="text"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              aria-label="Guess entry"
            />
          </div>

          <div class="actions" aria-label="Board controls">
            <button
              class="action-button primary"
              id="addGuess"
              type="button"
              disabled
            >
              Add guess
            </button>
            <button class="action-button" id="undo" type="button">Undo</button>
            <button class="action-button" id="reset" type="button">
              Reset
            </button>
          </div>

          <div class="message" id="message" aria-live="polite"></div>
        </section>

        <section class="mode-stack" aria-label="Wirdle modes">
          <div class="tabs mode-tabs" id="modeTabs" role="tablist" aria-label="Mode">
            <div class="tab-option">
              <button
                class="tab-button mode-tab-button"
                id="mode-easy"
                type="button"
                role="tab"
                aria-selected="true"
                aria-controls="easyModePanel"
                data-mode="easy"
              >
                Easy Mode
              </button>
            </div>
            <div class="tab-option">
              <button
                class="tab-button mode-tab-button"
                id="mode-post-game"
                type="button"
                role="tab"
                aria-selected="false"
                aria-controls="postGamePanel"
                data-mode="post-game"
              >
                Post Game
              </button>
            </div>
            <div class="tab-option">
              <button
                class="tab-button mode-tab-button"
                id="mode-advanced"
                type="button"
                role="tab"
                aria-selected="false"
                aria-controls="advancedPanel"
                data-mode="advanced"
              >
                Advanced Analyses
              </button>
            </div>
          </div>

          <section
            class="mode-panel primary-panel"
            id="easyModePanel"
            role="tabpanel"
            aria-labelledby="mode-easy"
          >
            <div class="section-heading">
              <h2>Easy Mode</h2>
              <div class="ranking-note" id="easyModeState">Live help</div>
            </div>
            <div class="toggle-row">
              <label class="toggle-label">
                <input id="easyHardMode" type="checkbox" />
                Hard Mode
              </label>
            </div>
            <button class="action-button primary" id="getHint" type="button">
              Get a hint
            </button>
            <div
              class="hint-shell"
              id="hintCard"
              aria-live="polite"
              hidden
            ></div>
            <div class="easy-share" id="easyShare" hidden>
              <button class="action-button" id="copyEasyShare" type="button">
                Copy share text
              </button>
            </div>
          </section>

          <section
            class="mode-panel"
            id="postGamePanel"
            role="tabpanel"
            aria-labelledby="mode-post-game"
            hidden
          >
            <div class="section-heading">
              <h2>Post Game</h2>
              <div class="ranking-note" id="postGameState">Finish board</div>
            </div>
            <button class="action-button primary" id="reviewGame" type="button" disabled>
              Review my game
            </button>
            <div class="coach-report" id="coachReport" hidden></div>
          </section>

          <section
            class="mode-panel"
            id="advancedPanel"
            role="tabpanel"
            aria-labelledby="mode-advanced"
            hidden
          >
            <div class="section-heading">
              <h2>Advanced Analyses</h2>
              <div class="ranking-note" id="rankingNote">Spoiler gated</div>
            </div>
            <p class="panel-copy">
              Solver-style rankings can reveal likely answers and reduce the challenge.
            </p>
            <button class="action-button" id="showAdvanced" type="button">
              Show Advanced Analyses
            </button>
            <div class="advanced-shell" id="advancedShell" hidden>
              <div class="tabs" id="suggestionTabs" role="tablist" aria-label="Suggestion type">
                <div class="tab-option">
                  <button
                    class="tab-button"
                    id="tab-power"
                    type="button"
                    role="tab"
                    aria-selected="true"
                    aria-controls="recommendations"
                    data-tab="power"
                  >
                    Power Words
                  </button>
                  <button
                    class="info-button tab-info-button"
                    type="button"
                    data-info-action="power-tab"
                    aria-label="About Power Words"
                  >
                    ?
                  </button>
                </div>
                <div class="tab-option">
                  <button
                    class="tab-button"
                    id="tab-answers"
                    type="button"
                    role="tab"
                    aria-selected="false"
                    aria-controls="recommendations"
                    data-tab="answers"
                  >
                    Answers
                  </button>
                  <button
                    class="info-button tab-info-button"
                    type="button"
                    data-info-action="answers-tab"
                    aria-label="About Answers"
                  >
                    ?
                  </button>
                </div>
              </div>
              <div class="recommendation-list" id="recommendations"></div>
            </div>
          </section>
        </section>
      </div>
    </main>

    <script>
      const ROW_COUNT = 6;
      const WORD_LENGTH = 5;
      const API_RECOMMENDATION_LIMIT = 50;
      const ANSWER_PREVIEW_LIMIT = 10;
      const SMALL_POOL_THRESHOLD = 20;
      const COACH_STORAGE_KEY = "wirdle-coach-dismissed";
      const statuses = ["absent", "present", "correct"];
      const statusLabels = {
        absent: "absent",
        present: "present",
        correct: "correct",
      };

      const board = document.querySelector("#board");
      const keyboardCapture = document.querySelector("#keyboardCapture");
      const message = document.querySelector("#message");
      const recommendations = document.querySelector("#recommendations");
      const rankingNote = document.querySelector("#rankingNote");
      const easyModeState = document.querySelector("#easyModeState");
      const easyModePanel = document.querySelector("#easyModePanel");
      const postGameState = document.querySelector("#postGameState");
      const postGamePanel = document.querySelector("#postGamePanel");
      const advancedPanel = document.querySelector("#advancedPanel");
      const getHintButton = document.querySelector("#getHint");
      const easyHardMode = document.querySelector("#easyHardMode");
      const hintCard = document.querySelector("#hintCard");
      const easyShare = document.querySelector("#easyShare");
      const copyEasyShareButton = document.querySelector("#copyEasyShare");
      const reviewGameButton = document.querySelector("#reviewGame");
      const coachReport = document.querySelector("#coachReport");
      const showAdvancedButton = document.querySelector("#showAdvanced");
      const advancedShell = document.querySelector("#advancedShell");
      const modeTabButtons = Array.from(
        document.querySelectorAll(".mode-tab-button"),
      );
      const dataInfo = document.querySelector("#dataInfo");
      const addGuessButton = document.querySelector("#addGuess");
      const undoButton = document.querySelector("#undo");
      const resetButton = document.querySelector("#reset");
      const coachHelp = document.querySelector("#coachHelp");
      const infoOverlay = document.querySelector("#infoOverlay");
      const overlayTitle = document.querySelector("#overlayTitle");
      const overlayBody = document.querySelector("#overlayBody");
      const overlayClose = document.querySelector("#overlayClose");
      const overlayAction = document.querySelector("#overlayAction");
      const suggestionTabs = document.querySelector("#suggestionTabs");
      const tabButtons = Array.from(
        document.querySelectorAll("#suggestionTabs .tab-button"),
      );

      const submittedGuesses = [];
      let activeLetters = [];
      let latestSolveId = 0;
      let latestRecommendationData = null;
      let activeSuggestionTab = "power";
      let answersExpanded = false;
      let wordListInfo = null;
      let activeOverlayKind = null;
      let activeOverlayAction = null;
      let advancedConfirmed = false;
      let latestCoachId = 0;
      let latestShareText = "";
      let latestHintId = 0;
      let latestHintData = null;
      let highestHintLevelUsed = 0;
      let hintLevelsUsed = [];
      let pendingHintLevel = null;
      let easyModeHardMode = false;
      let latestEasyShareText = "";
      let hintRequestInFlight = false;

      function setMessage(text, isError = false) {
        message.textContent = text;
        message.classList.toggle("error", isError);
      }

      function focusKeyboard() {
        keyboardCapture.focus({ preventScroll: true });
      }

      function syncKeyboardCapture() {
        keyboardCapture.value = activeLetters.join("");
      }

      function titleCase(value) {
        return value.charAt(0).toUpperCase() + value.slice(1);
      }

      function formatNumber(value) {
        return new Intl.NumberFormat().format(value);
      }

      function solvedTurn() {
        const index = submittedGuesses.findIndex((guess) =>
          guess.statuses.every((status) => status === "correct"),
        );
        return index === -1 ? null : index + 1;
      }

      function isBoardComplete() {
        return solvedTurn() !== null || submittedGuesses.length === ROW_COUNT;
      }

      function canEditActiveRow() {
        return submittedGuesses.length < ROW_COUNT && solvedTurn() === null;
      }

      function clearCoachReport() {
        latestCoachId += 1;
        latestShareText = "";
        coachReport.hidden = true;
        coachReport.innerHTML = "";
      }

      function clearEasyHintState({ preserveUsage = false } = {}) {
        latestHintId += 1;
        latestHintData = null;
        if (!preserveUsage) {
          highestHintLevelUsed = 0;
          hintLevelsUsed = [];
        }
        pendingHintLevel = null;
        latestEasyShareText = "";
        hintRequestInFlight = false;
        hintCard.hidden = true;
        hintCard.innerHTML = "";
        easyShare.hidden = true;
        syncEasyModeState();
      }

      function setActiveMode(mode) {
        modeTabButtons.forEach((button) => {
          const isSelected = button.dataset.mode === mode;
          button.setAttribute("aria-selected", String(isSelected));
        });
        easyModePanel.hidden = mode !== "easy";
        postGamePanel.hidden = mode !== "post-game";
        advancedPanel.hidden = mode !== "advanced";
        easyModePanel.classList.toggle("primary-panel", mode === "easy");
        postGamePanel.classList.toggle("primary-panel", mode === "post-game");
        advancedPanel.classList.toggle("primary-panel", mode === "advanced");
      }

      function syncEasyModeState() {
        const complete = isBoardComplete();
        getHintButton.disabled = complete || hintRequestInFlight;
        if (complete) {
          easyModeState.textContent = "Game complete";
          getHintButton.textContent = "Get a hint";
          return;
        }
        if (hintRequestInFlight) {
          easyModeState.textContent = "Thinking";
          getHintButton.textContent = "Getting hint...";
          return;
        }
        if (latestHintData) {
          easyModeState.textContent = `Level ${latestHintData.level}`;
          getHintButton.textContent = "Get a hint";
          return;
        }
        easyModeState.textContent = "Live help";
        getHintButton.textContent = "Get a hint";
      }

      function syncPostGameState() {
        const turn = solvedTurn();
        if (turn !== null) {
          postGameState.textContent = `Solved in ${turn}`;
        } else if (submittedGuesses.length === ROW_COUNT) {
          postGameState.textContent = "Six rows";
        } else {
          postGameState.textContent = "Finish board";
        }
        reviewGameButton.disabled = !isBoardComplete();
      }

      function isCoachDismissed() {
        try {
          return localStorage.getItem(COACH_STORAGE_KEY) === "true";
        } catch (_err) {
          return false;
        }
      }

      function markCoachDismissed() {
        try {
          localStorage.setItem(COACH_STORAGE_KEY, "true");
        } catch (_err) {}
      }

      function openOverlay(
        title,
        body,
        kind = "info",
        actionLabel = "Got it",
        onAction = null,
      ) {
        activeOverlayKind = kind;
        activeOverlayAction = onAction;
        overlayTitle.textContent = title;
        overlayBody.innerHTML = body;
        overlayAction.textContent = actionLabel;
        infoOverlay.hidden = false;
        overlayClose.focus({ preventScroll: true });
      }

      function closeOverlay() {
        if (activeOverlayKind === "coach") {
          markCoachDismissed();
        }
        activeOverlayKind = null;
        activeOverlayAction = null;
        overlayAction.textContent = "Got it";
        infoOverlay.hidden = true;
      }

      function openCoach() {
        openOverlay(
          "How Wirdle Helps",
          `
            <p>Wirdle does not know today&apos;s answer. Play a guess in Wordle, add that same word here, then tap the tiles to match Wordle&apos;s colors.</p>
            <p><strong>Easy Mode</strong> gives live hints that get stronger only when you ask.</p>
            <p><strong>Post Game</strong> reviews a finished board with grades, turn notes, and share text.</p>
            <p><strong>Advanced Analyses</strong> keeps the old solver-style rankings behind a spoiler warning.</p>
          `,
          "coach",
        );
      }

      function openDataInfo() {
        const details = wordListInfo
          ? `<p>Loaded ${formatNumber(wordListInfo.allowedGuesses)} accepted words. Any of them can be the answer, and ${formatNumber(wordListInfo.likelierSolutions)} of them are words the NYT has historically drawn answers from, which are weighted more heavily.</p>
            <p>Historical solutions: ${formatNumber(wordListInfo.pastSolutions)} from ${wordListInfo.pastSolutionFirstDate} through ${wordListInfo.pastSolutionLatestDate}.</p>`
          : "<p>The word lists are still loading.</p>";
        openOverlay(
          "Word Lists",
          `${details}<p>This only describes the data behind Wirdle. It is not a hint about today&apos;s puzzle.</p>`,
        );
      }

      function renderTile(rowIndex, tileIndex) {
        const submitted = submittedGuesses[rowIndex];
        const isActive =
          rowIndex === submittedGuesses.length &&
          submittedGuesses.length < ROW_COUNT;
        const letter = submitted
          ? submitted.word[tileIndex]
          : isActive
            ? activeLetters[tileIndex] || ""
            : "";
        const status = submitted ? submitted.statuses[tileIndex] : "";
        const tile = document.createElement(submitted ? "button" : "div");

        tile.className = [
          "tile",
          submitted ? status : "",
          !submitted && letter ? "filled" : "",
          !submitted && !isActive ? "future" : "",
        ]
          .filter(Boolean)
          .join(" ");
        tile.textContent = letter;

        if (!submitted) {
          tile.setAttribute("aria-hidden", "true");
          return tile;
        }

        tile.type = "button";
        tile.title = titleCase(statusLabels[status]);
        tile.setAttribute(
          "aria-label",
          `${letter.toUpperCase()} ${statusLabels[status]}. Change feedback.`,
        );
        tile.addEventListener("click", () => {
          const current = statuses.indexOf(status);
          submitted.statuses[tileIndex] =
            statuses[(current + 1) % statuses.length];
          clearCoachReport();
          clearEasyHintState();
          renderBoard();
          refreshRecommendations();
          focusKeyboard();
        });
        return tile;
      }

      function renderBoard() {
        board.innerHTML = "";
        for (let rowIndex = 0; rowIndex < ROW_COUNT; rowIndex += 1) {
          const row = document.createElement("div");
          row.className = "row";
          row.setAttribute("aria-label", `Row ${rowIndex + 1}`);
          for (let tileIndex = 0; tileIndex < WORD_LENGTH; tileIndex += 1) {
            row.appendChild(renderTile(rowIndex, tileIndex));
          }
          board.appendChild(row);
        }

        undoButton.disabled = submittedGuesses.length === 0;
        resetButton.disabled =
          submittedGuesses.length === 0 && activeLetters.length === 0;
        addGuessButton.disabled =
          !canEditActiveRow() ||
          activeLetters.length !== WORD_LENGTH;
        syncKeyboardCapture();
        syncPostGameState();
        syncEasyModeState();
      }

      function addLetter(letter) {
        if (
          !canEditActiveRow() ||
          activeLetters.length >= WORD_LENGTH
        ) {
          return;
        }
        activeLetters.push(letter.toLowerCase());
        renderBoard();
        setMessage("");
      }

      function removeLetter() {
        if (!activeLetters.length) {
          return;
        }
        activeLetters.pop();
        renderBoard();
        setMessage("");
      }

      function submitActiveRow() {
        if (submittedGuesses.length >= ROW_COUNT) {
          return;
        }
        if (solvedTurn() !== null) {
          setMessage("The board is already solved.", true);
          return;
        }
        if (activeLetters.length !== WORD_LENGTH) {
          setMessage("Five letters needed.", true);
          return;
        }
        submittedGuesses.push({
          word: activeLetters.join(""),
          statuses: ["absent", "absent", "absent", "absent", "absent"],
        });
        activeLetters = [];
        clearCoachReport();
        clearEasyHintState({ preserveUsage: true });
        renderBoard();
        refreshRecommendations();
        setMessage("");
      }

      function fillActiveRow(word) {
        if (!canEditActiveRow()) {
          setMessage("All rows are filled.", true);
          return;
        }
        activeLetters = word.toLowerCase().slice(0, WORD_LENGTH).split("");
        clearCoachReport();
        renderBoard();
        focusKeyboard();
        setMessage("");
      }

      function buildAnswerRows(data) {
        return data.likely_answers.map((answer) => ({
          type: "answer",
          word: answer.word,
          score: answer.score,
          reason: "",
          chance: answer.probability,
          usedBefore: answer.used_before,
          details: answer.used_before
            ? `<p>Chance: ${(answer.probability * 100).toFixed(1)}%.</p><p>Status: used before. This word appears in Wirdle&apos;s historical answer data, so it is ranked lower but still kept possible.</p>`
            : `<p>Chance: ${(answer.probability * 100).toFixed(1)}%.</p><p>Status: never used before. Wirdle has not seen this word in the loaded historical answer data.</p>`,
        }));
      }

      function buildPowerWordRows(data) {
        const likelyWords = new Set(
          data.likely_answers.map((answer) => answer.word),
        );
        return data.best_information_guesses
          .filter(
            (guess) =>
              // Every accepted word is "possible" now, so a probe is a word the
              // answer list does not draw from, not merely an inconsistent one.
              !guess.is_likelier &&
              !likelyWords.has(guess.word) &&
              guess.entropy_bits > 0 &&
              guess.worst_case_remaining < data.remaining_candidates,
          )
          .slice(0, 10)
          .map((guess) => ({
            type: "power",
            word: guess.word,
            score: guess.score,
            reason: "",
            details: `<p>Information score: ${guess.entropy_bits.toFixed(2)} bits.</p><p>Worst case: ${formatNumber(guess.worst_case_remaining)} possible answers remain.</p><p>Average result: ${guess.expected_remaining.toFixed(1)} possible answers remain.</p>`,
          }));
      }

      function setActiveSuggestionTab(tab) {
        activeSuggestionTab = tab;
        tabButtons.forEach((button) => {
          const isSelected = button.dataset.tab === tab;
          button.setAttribute("aria-selected", String(isSelected));
        });
        renderRecommendations();
      }

      function currentSuggestionRows() {
        if (!latestRecommendationData) {
          return [];
        }
        return activeSuggestionTab === "answers"
          ? buildAnswerRows(latestRecommendationData)
          : buildPowerWordRows(latestRecommendationData);
      }

      function findSuggestionItem(type, word) {
        return currentSuggestionRows().find(
          (item) => item.type === type && item.word === word,
        );
      }

      function openPowerWordsInfo() {
        openOverlay(
          "Power Words",
          `
            <p>Power Words are allowed Wordle guesses that are not currently possible answers.</p>
            <p>They are ranked by how well they split the remaining possibilities after you enter Wordle&apos;s colors.</p>
            <p>A higher information score means Wirdle expects that word to separate the possibilities more strongly.</p>
          `,
        );
      }

      function openAnswersInfo() {
        openOverlay(
          "Answers",
          `
            <p>Answers are words still consistent with every color you entered.</p>
            <p>A short preview is shown while many answers are possible. More answer ideas appear once the board is narrowed down.</p>
            <p>Chance is Wirdle&apos;s rough ranking for which remaining word looks most plausible. It is not secret knowledge from Wordle.</p>
            <p>Never used before means the word is not in Wirdle&apos;s loaded historical answer data. Used before means it is in that data, but Wordle repeats are still possible.</p>
          `,
        );
      }

      function openAdvancedWarning() {
        openOverlay(
          "Advanced Analyses",
          `
            <p>Advanced Analyses can reveal likely answers and reduce the challenge of today&apos;s Wordle.</p>
            <p>Continue only if you want solver-style rankings for the board you entered.</p>
          `,
          "advanced",
          "Show analyses",
          () => {
            advancedConfirmed = true;
            advancedShell.hidden = false;
            showAdvancedButton.hidden = true;
            refreshRecommendations();
          },
        );
      }

      function openSuggestionInfo(type, word) {
        const item = findSuggestionItem(type, word);
        if (!item) {
          return;
        }
        openOverlay(item.word.toUpperCase(), item.details);
      }

      function renderRecommendationCard(item, index) {
        const canFill = submittedGuesses.length < ROW_COUNT;
        const classes = [
          "recommendation",
          index === 0 ? "best" : "",
          canFill ? "selectable" : "disabled",
        ]
          .filter(Boolean)
          .join(" ");
        const reason = item.reason
          ? `<div class="recommendation-reason">${item.reason}</div>`
          : "";

        return `
          <article class="${classes}" role="button" tabindex="0" data-word="${item.word}" aria-disabled="${!canFill}">
            <div class="recommendation-word">${item.word.toUpperCase()}</div>
            <div class="recommendation-actions">
              <button class="info-button" type="button" data-info-action="${item.type}" data-info-word="${item.word}" aria-label="About ${item.word.toUpperCase()}">i</button>
            </div>
            ${reason}
          </article>
        `;
      }

      function renderPowerWords(data) {
        const rows = buildPowerWordRows(data);
        rankingNote.textContent = submittedGuesses.length
          ? "Optional boost"
          : "Opening boosts";

        if (!rows.length) {
          recommendations.innerHTML = `<div class="empty-state">No power words available.</div>`;
          return;
        }

        recommendations.innerHTML = rows.map(renderRecommendationCard).join("");
      }

      function renderAnswers(data) {
        const rows = buildAnswerRows(data);
        const canShowAll =
          data.remaining_candidates <= SMALL_POOL_THRESHOLD &&
          rows.length > ANSWER_PREVIEW_LIMIT;
        const visibleRows =
          data.remaining_candidates > SMALL_POOL_THRESHOLD
            ? rows.slice(0, ANSWER_PREVIEW_LIMIT)
            : canShowAll && !answersExpanded
              ? rows.slice(0, ANSWER_PREVIEW_LIMIT)
              : rows;
        const showAll =
          canShowAll && !answersExpanded
            ? `<button class="show-all-button" type="button" id="showAllAnswers">Show all possible answers</button>`
            : "";

        rankingNote.textContent = `${formatNumber(data.remaining_candidates)} possible`;

        if (!rows.length) {
          recommendations.innerHTML = `<div class="empty-state">No possible answers available.</div>`;
          return;
        }

        recommendations.innerHTML = [
          ...visibleRows.map(renderRecommendationCard),
          showAll,
        ]
          .filter(Boolean)
          .join("");
      }

      function renderLoadingRecommendations() {
        const hasRecommendations = Boolean(
          recommendations.querySelector(
            ".recommendation:not([aria-hidden='true'])",
          ),
        );
        recommendations.classList.add("is-loading");
        recommendations.setAttribute("aria-busy", "true");

        if (hasRecommendations) {
          return;
        }

        recommendations.innerHTML = Array.from(
          { length: 5 },
          (_, index) => `
          <article class="recommendation ${index === 0 ? "best" : ""}" aria-hidden="true">
            <span class="loading-bar loading-word"></span>
            <span class="loading-bar loading-label"></span>
            <span class="loading-bar loading-reason"></span>
          </article>
        `,
        ).join("");
      }

      function renderRecommendations(data = latestRecommendationData) {
        if (!data) {
          return;
        }
        recommendations.classList.remove("is-loading");
        recommendations.removeAttribute("aria-busy");

        if (activeSuggestionTab === "answers") {
          renderAnswers(data);
          return;
        }

        renderPowerWords(data);
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderCoachReport(data) {
        const report = data.post_game;
        const summary = report.summary;
        const missed = summary.missed_opportunity
          ? `<p class="summary-line">${escapeHtml(summary.missed_opportunity)}</p>`
          : "";
        const recovery =
          summary.best_recovery_turn === null
            ? ""
            : `<p class="summary-line">Best recovery: turn ${summary.best_recovery_turn}.</p>`;
        const turns = report.turns
          .map(
            (turn) => `
              <article class="turn-review">
                <div class="turn-review-header">
                  <div class="turn-title">Turn ${turn.turn}: ${escapeHtml(turn.label)}</div>
                  <div class="turn-grade">${escapeHtml(turn.grade)}</div>
                </div>
                <p class="turn-copy">${escapeHtml(turn.summary)}</p>
                <p class="turn-copy">${escapeHtml(turn.did_well)}</p>
                <p class="turn-copy">${escapeHtml(turn.missed)}</p>
              </article>
            `,
          )
          .join("");

        latestShareText = data.share?.text || "";
        coachReport.innerHTML = `
          <div class="summary-band">
            <p class="summary-line">Best move: turn ${summary.best_move_turn}. Biggest information gain: turn ${summary.biggest_information_gain_turn}.</p>
            <p class="summary-line">Most questionable move: turn ${summary.most_questionable_turn}.</p>
            ${recovery}
            ${missed}
            <p class="summary-line">${escapeHtml(summary.lesson)}</p>
          </div>
          <button class="action-button" id="copyShare" type="button">Copy share text</button>
          <div class="turn-timeline">${turns}</div>
        `;
        coachReport.hidden = false;
      }

      function spoilerRiskLabel(value) {
        return String(value || "")
          .split("_")
          .map(titleCase)
          .join(" ");
      }

      function renderEasyHint(data) {
        const hint = data.easy_hint;
        latestHintData = hint;
        latestEasyShareText = data.share?.text || "";
        highestHintLevelUsed = Math.max(
          highestHintLevelUsed,
          hint.share_summary?.highest_hint_level_used || hint.level,
        );
        if (!hintLevelsUsed.includes(hint.level)) {
          hintLevelsUsed.push(hint.level);
          hintLevelsUsed.sort((a, b) => a - b);
        }

        const rationale = hint.rationale
          ? `<p class="hint-rationale">${escapeHtml(hint.rationale)}</p>`
          : "";
        const revealedWords = hint.revealed_words?.length
          ? `<div class="revealed-words">${hint.revealed_words
              .map(
                (word) =>
                  `<span class="revealed-word">${escapeHtml(word)}</span>`,
              )
              .join("")}</div>`
          : "";
        const stronger = hint.next_action_label
          ? `<button class="action-button primary" id="strongerHint" type="button">${escapeHtml(hint.next_action_label)}</button>`
          : "";
        const explain = `<button class="action-button" id="explainHint" type="button">Explain that</button>`;

        hintCard.innerHTML = `
          <article class="hint-card">
            <div class="hint-meta">
              <div class="hint-label">Level ${hint.level}: ${escapeHtml(hint.label)}</div>
              <div class="hint-risk">${escapeHtml(spoilerRiskLabel(hint.spoiler_risk))}</div>
            </div>
            <p class="hint-message">${escapeHtml(hint.message)}</p>
            ${revealedWords}
            ${rationale}
            <div class="hint-actions">
              ${stronger}
              ${explain}
            </div>
          </article>
        `;
        hintCard.hidden = false;
        easyShare.hidden = !latestEasyShareText;
        syncEasyModeState();
      }

      function openHintWarning(level, explainCurrent = false) {
        const isReveal = level >= 6;
        openOverlay(
          isReveal ? "Reveal answer?" : "Stronger hint?",
          isReveal
            ? "<p>This can reveal the answer if your board narrows to one compatible word.</p>"
            : "<p>This can reveal answer-like words and reduce the puzzle.</p>",
          "hint-spoiler",
          isReveal ? "Reveal answer" : "Show stronger hint",
          () => {
            requestHint({
              requestedLevel: level,
              explainCurrent,
              confirmedSpoiler: true,
            });
          },
        );
      }

      async function requestHint({
        requestedLevel = null,
        explainCurrent = false,
        confirmedSpoiler = false,
      } = {}) {
        if (isBoardComplete()) {
          setMessage("This game is complete. Use Post Game for a review.", true);
          syncEasyModeState();
          return;
        }
        const hintId = latestHintId + 1;
        latestHintId = hintId;
        pendingHintLevel = requestedLevel;
        hintRequestInFlight = true;
        syncEasyModeState();
        setMessage("");

        const hintRequest = {};
        if (requestedLevel !== null) {
          hintRequest.requested_level = requestedLevel;
        }
        if (explainCurrent) {
          hintRequest.explain_current = true;
          if (hintRequest.requested_level === undefined && latestHintData) {
            hintRequest.requested_level = latestHintData.level;
          }
        }
        if (confirmedSpoiler) {
          hintRequest.confirmed_spoiler = true;
        }

        try {
          const response = await fetch("/v1/coach", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              intent: "easy_hint",
              guesses: submittedGuesses,
              hard_mode: easyModeHardMode,
              hint_request: hintRequest,
              session_context: {
                highest_hint_level_used: highestHintLevelUsed,
                hint_levels_used: hintLevelsUsed,
              },
            }),
          });
          const data = await response.json();
          if (hintId !== latestHintId) {
            return;
          }
          if (!response.ok) {
            if (data.error === "spoiler_confirmation_required") {
              openHintWarning(
                requestedLevel || Math.min((latestHintData?.level || 4) + 1, 6),
                explainCurrent,
              );
              setMessage("");
              return;
            }
            setMessage(data.message || "Hint unavailable.", true);
            return;
          }
          renderEasyHint(data);
          setMessage("");
        } catch (_err) {
          if (hintId === latestHintId) {
            setMessage("Hint unavailable.", true);
          }
        } finally {
          if (hintId === latestHintId) {
            hintRequestInFlight = false;
            pendingHintLevel = null;
            syncEasyModeState();
          }
        }
      }

      async function reviewGame() {
        if (!isBoardComplete()) {
          setMessage("Finish the Wordle board before reviewing your game.", true);
          return;
        }
        const coachId = latestCoachId + 1;
        latestCoachId = coachId;
        reviewGameButton.disabled = true;
        reviewGameButton.textContent = "Reviewing...";
        setMessage("");

        try {
          const response = await fetch("/v1/coach", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              intent: "post_game_review",
              guesses: submittedGuesses,
              hard_mode: false,
              session_context: {
                highest_hint_level_used: highestHintLevelUsed,
                hint_levels_used: hintLevelsUsed,
              },
            }),
          });
          const data = await response.json();
          if (coachId !== latestCoachId) {
            return;
          }
          if (!response.ok) {
            latestShareText = "";
            coachReport.hidden = true;
            coachReport.innerHTML = "";
            setMessage(data.message || "Board could not be reviewed.", true);
            return;
          }
          renderCoachReport(data);
          setMessage("");
        } catch (_err) {
          if (coachId === latestCoachId) {
            latestShareText = "";
            coachReport.hidden = true;
            coachReport.innerHTML = "";
            setMessage("Post-game review unavailable.", true);
          }
        } finally {
          if (coachId === latestCoachId) {
            reviewGameButton.textContent = "Review my game";
            syncPostGameState();
          }
        }
      }

      async function refreshRecommendations() {
        if (!advancedConfirmed) {
          latestRecommendationData = null;
          return;
        }
        const solveId = latestSolveId + 1;
        latestSolveId = solveId;
        rankingNote.textContent =
          activeSuggestionTab === "answers"
            ? "Loading answers"
            : "Optional boost";
        renderLoadingRecommendations();
        setMessage("");

        try {
          const response = await fetch("/v1/solve", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              guesses: submittedGuesses,
              mode: "hybrid",
              hard_mode: false,
              limit: API_RECOMMENDATION_LIMIT,
              past_solution_policy: {
                enabled: true,
                weight_multiplier: 0.05,
                recent_repeat_multiplier: 0.01,
                recent_days: 90,
              },
            }),
          });
          const data = await response.json();
          if (solveId !== latestSolveId) {
            return;
          }
          if (!response.ok) {
            recommendations.classList.remove("is-loading");
            recommendations.removeAttribute("aria-busy");
            if (
              !recommendations.querySelector(
                ".recommendation:not([aria-hidden='true'])",
              )
            ) {
              recommendations.innerHTML = `<div class="empty-state">No recommendations available.</div>`;
            }
            latestRecommendationData = null;
            setMessage(
              data.message || "Board feedback does not match any answer.",
              true,
            );
            return;
          }
          latestRecommendationData = data;
          answersExpanded = false;
          renderRecommendations(data);
        } catch (_err) {
          if (solveId === latestSolveId) {
            recommendations.classList.remove("is-loading");
            recommendations.removeAttribute("aria-busy");
            if (
              !recommendations.querySelector(
                ".recommendation:not([aria-hidden='true'])",
              )
            ) {
              recommendations.innerHTML = `<div class="empty-state">No recommendations available.</div>`;
            }
            latestRecommendationData = null;
            setMessage("Recommendations unavailable.", true);
          }
        }
      }

      function handleKey(key) {
        if (/^[a-zA-Z]$/.test(key)) {
          addLetter(key);
          return true;
        }
        if (key === "Backspace") {
          removeLetter();
          return true;
        }
        if (key === "Enter") {
          submitActiveRow();
          return true;
        }
        return false;
      }

      document.addEventListener("keydown", (event) => {
        if (!infoOverlay.hidden) {
          return;
        }
        if (event.metaKey || event.ctrlKey || event.altKey) {
          return;
        }
        if (handleKey(event.key)) {
          event.preventDefault();
          focusKeyboard();
        }
      });

      keyboardCapture.addEventListener("input", () => {
        const letters = keyboardCapture.value
          .toLowerCase()
          .replace(/[^a-z]/g, "")
          .slice(0, WORD_LENGTH);
        activeLetters = letters.split("");
        clearCoachReport();
        renderBoard();
      });

      board.addEventListener("click", focusKeyboard);
      board.addEventListener("focus", focusKeyboard);

      addGuessButton.addEventListener("click", () => {
        submitActiveRow();
        focusKeyboard();
      });

      undoButton.addEventListener("click", () => {
        submittedGuesses.pop();
        clearCoachReport();
        clearEasyHintState();
        renderBoard();
        refreshRecommendations();
        focusKeyboard();
      });

      resetButton.addEventListener("click", () => {
        submittedGuesses.length = 0;
        activeLetters = [];
        clearCoachReport();
        clearEasyHintState();
        renderBoard();
        refreshRecommendations();
        focusKeyboard();
      });

      dataInfo.addEventListener("click", openDataInfo);
      getHintButton.addEventListener("click", () => {
        requestHint();
      });
      easyHardMode.addEventListener("change", () => {
        easyModeHardMode = easyHardMode.checked;
        clearEasyHintState();
        setMessage("");
      });
      reviewGameButton.addEventListener("click", reviewGame);
      showAdvancedButton.addEventListener("click", openAdvancedWarning);
      coachHelp.addEventListener("click", () => {
        openCoach();
      });
      overlayClose.addEventListener("click", closeOverlay);
      overlayAction.addEventListener("click", () => {
        const action = activeOverlayAction;
        closeOverlay();
        if (action) {
          action();
        }
      });
      infoOverlay.addEventListener("click", (event) => {
        if (event.target.closest("[data-close-overlay]")) {
          closeOverlay();
        }
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !infoOverlay.hidden) {
          closeOverlay();
        }
      });

      modeTabButtons.forEach((button) => {
        button.addEventListener("click", () => {
          setActiveMode(button.dataset.mode);
        });
      });

      hintCard.addEventListener("click", (event) => {
        if (event.target.closest("#strongerHint")) {
          const nextLevel = Math.min((latestHintData?.level || 0) + 1, 6);
          requestHint({ requestedLevel: nextLevel });
          return;
        }
        if (event.target.closest("#explainHint")) {
          requestHint({
            requestedLevel: latestHintData?.level || highestHintLevelUsed || 1,
            explainCurrent: true,
          });
        }
      });

      tabButtons.forEach((button) => {
        button.addEventListener("click", () => {
          setActiveSuggestionTab(button.dataset.tab);
        });
      });

      suggestionTabs.addEventListener("click", (event) => {
        const infoButton = event.target.closest("[data-info-action]");
        if (!infoButton) {
          return;
        }
        const action = infoButton.dataset.infoAction;
        if (action === "power-tab") {
          openPowerWordsInfo();
          return;
        }
        if (action === "answers-tab") {
          openAnswersInfo();
        }
      });

      coachReport.addEventListener("click", async (event) => {
        if (!event.target.closest("#copyShare")) {
          return;
        }
        if (!latestShareText) {
          setMessage("Share text unavailable.", true);
          return;
        }
        try {
          await navigator.clipboard.writeText(latestShareText);
          setMessage("Share text copied.");
        } catch (_err) {
          setMessage("Share text could not be copied.", true);
        }
      });

      copyEasyShareButton.addEventListener("click", async () => {
        if (!latestEasyShareText) {
          setMessage("Share text unavailable.", true);
          return;
        }
        try {
          await navigator.clipboard.writeText(latestEasyShareText);
          setMessage("Share text copied.");
        } catch (_err) {
          setMessage("Share text could not be copied.", true);
        }
      });

      recommendations.addEventListener("click", (event) => {
        if (event.target.closest("#showAllAnswers")) {
          answersExpanded = true;
          renderRecommendations();
          return;
        }

        const infoButton = event.target.closest("[data-info-action]");
        if (infoButton) {
          const action = infoButton.dataset.infoAction;
          if (action === "power-tab") {
            openPowerWordsInfo();
            return;
          }
          if (action === "answers-tab") {
            openAnswersInfo();
            return;
          }
          openSuggestionInfo(action, infoButton.dataset.infoWord);
          return;
        }

        const card = event.target.closest("[data-word]");
        if (!card) {
          return;
        }
        fillActiveRow(card.dataset.word);
      });

      recommendations.addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " ") {
          return;
        }
        const card = event.target.closest("[data-word]");
        if (!card || event.target.closest("button")) {
          return;
        }
        event.preventDefault();
        fillActiveRow(card.dataset.word);
      });

      fetch("/v1/health")
        .then((response) => response.json())
        .then((data) => {
          wordListInfo = {
            likelierSolutions: data.likelier_solutions,
            allowedGuesses: data.allowed_guesses,
            pastSolutions: data.past_solutions,
            pastSolutionFirstDate: data.past_solution_first_date,
            pastSolutionLatestDate: data.past_solution_latest_date,
          };
          dataInfo.disabled = false;
        })
        .catch(() => {
          wordListInfo = null;
        });

      renderBoard();
      refreshRecommendations();
      if (!isCoachDismissed()) {
        openCoach();
      }
    </script>
  </body>
</html>
